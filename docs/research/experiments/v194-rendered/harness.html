<!doctype html>
<!-- V194 experiment e01: the rendered view's picture, outside the app.
     The engine's own render/rendered-core.js (its import and export lines dropped, as the build drops them) and
     runtime/three, on a small made-up site: a house with glass, a canopy on columns, neighbours, trees, a road.
     One of the neighbours is wound the other way, as this app's meshes can be; the picture takes no normals.
     Served from the repository's root (python -m http.server); run.mjs drives it and takes the pictures.
     ?sky=clear|overcast|dusk|white  ?alt=42&az=215 (the sun; alt<=0 is night)  ?flat=1 (a plan)  ?edges=1  ?n=64 -->
<meta charset="utf-8">
<title>V194 e01: the rendered view's picture</title>
<style>html,body{margin:0;height:100%;background:#15181c;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="cv"></canvas>
<script src="/runtime/three/0.186.1/bim-three.min.js"></script>
<script>
(async function () {
  var q = new URLSearchParams(location.search), out = { errors: [] };
  window.__result = out;
  window.addEventListener('error', function (e) { out.errors.push(String(e.message)); });
  try {
    var txt = await (await fetch('/src/js/engine/render/rendered-core.js')).text();
    txt = txt.replace(/^import [^\n]*\n/gm, '').replace(/\nexport \{[^}]*\};\s*$/, '\n');
    (0, eval)(txt);
    var T = window.BIMTHREE, cv = document.getElementById('cv'), W = window.innerWidth, H = window.innerHeight;
    function lin(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    function hex(h) { var n = parseInt(h.slice(1), 16); return [lin(((n >> 16) & 255) / 255), lin(((n >> 8) & 255) / 255), lin((n & 255) / 255)]; }
    var O = { pos: [], col: [] }, Tr = { pos: [], col: [] }, Ed = { pos: [] };
    function quad(a, b, c, d, n, col, alpha, flipN, flipW) {
      var dst = alpha < 1 ? Tr : O, order = flipW ? [a, c, b, a, d, c] : [a, b, c, a, c, d];
      order.forEach(function (p) { dst.pos.push(p[0], p[1], p[2]); dst.col.push(col[0], col[1], col[2]); if (alpha < 1) dst.col.push(alpha); });
      [[a, b], [b, c], [c, d], [d, a]].forEach(function (e) { Ed.pos.push(e[0][0], e[0][1], e[0][2], e[1][0], e[1][1], e[1][2]); });
    }
    function box(x0, y0, z0, x1, y1, z1, colHex, alpha, flipN, flipW) {
      var c = hex(colHex), a = alpha == null ? 1 : alpha;
      var p = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
      quad(p[1], p[0], p[3], p[2], [0, 0, -1], c, a, flipN, flipW); quad(p[4], p[5], p[6], p[7], [0, 0, 1], c, a, flipN, flipW);
      quad(p[0], p[4], p[7], p[3], [-1, 0, 0], c, a, flipN, flipW); quad(p[5], p[1], p[2], p[6], [1, 0, 0], c, a, flipN, flipW);
      quad(p[3], p[7], p[6], p[2], [0, 1, 0], c, a, flipN, flipW); quad(p[0], p[1], p[5], p[4], [0, -1, 0], c, a, flipN, flipW);
    }
    function crown(cx, cy, cz, r, colHex) {
      var c = hex(colHex), i, j, A = 6, B = 10;
      function pt(i, j) { var t = Math.PI * i / A, f = 2 * Math.PI * j / B; return [cx + r * Math.sin(t) * Math.cos(f), cy + r * Math.cos(t), cz + r * Math.sin(t) * Math.sin(f)]; }
      for (i = 0; i < A; i++) for (j = 0; j < B; j++) {
        var a = pt(i, j), b = pt(i + 1, j), d = pt(i, j + 1), e = pt(i + 1, j + 1), m = pt(i + 0.5, j + 0.5), n = [(m[0] - cx) / r, (m[1] - cy) / r, (m[2] - cz) / r];
        quad(a, d, e, b, n, c, 1);
      }
    }
    /* the house: a slab, walls with a glazed south front, an upper floor set back, a roof with an overhang */
    box(-5, 0, -4, 5, 0.3, 4, '#c9c5bb');
    box(-5, 0.3, -4, 5, 3.3, -3.75, '#e8e2d4'); box(-5, 0.3, -4, -4.75, 3.3, 4, '#e8e2d4'); box(4.75, 0.3, -4, 5, 3.3, 4, '#e8e2d4');
    box(-5, 0.3, 3.75, -3.2, 3.3, 4, '#e8e2d4'); box(3.2, 0.3, 3.75, 5, 3.3, 4, '#e8e2d4'); box(-0.4, 0.3, 3.75, 0.4, 3.3, 4, '#e8e2d4');
    box(-3.2, 2.7, 3.75, 3.2, 3.3, 4, '#e8e2d4');
    box(-3.2, 0.3, 3.85, -0.4, 2.7, 3.9, '#9fc4d8', 0.35); box(0.4, 0.3, 3.85, 3.2, 2.7, 3.9, '#9fc4d8', 0.35);
    box(-5.4, 3.3, -4.4, 5.4, 3.6, 6.4, '#bdb8ad');
    box(-3.5, 3.6, -3.5, 3.5, 6.3, 1.5, '#d6cbb6'); box(-4, 6.3, -4, 4, 6.55, 2.2, '#8c5a48');
    [-4.6, -1.5, 1.5, 4.6].forEach(function (x) { box(x - 0.15, 0, 5.9, x + 0.15, 3.3, 6.2, '#7d8891'); });
    /* neighbours: one wound the other way */
    box(-22, 0, -9, -12, 9, 3, '#a8695a'); box(-21, 9, -8, -13, 9.4, 2, '#5f6268');
    box(12, 0, -12, 20, 14, -2, '#b9b2a4', 1, false, true); box(11, 0, 4, 19, 6, 12, '#96705c');
    box(-9, 0, -22, 3, 11, -13, '#c7b299'); box(8, 0, -24, 16, 7, -16, '#8a5a4a');
    /* the street and trees */
    box(-40, 0, 12.5, 40, 0.06, 19.5, '#4b4e53'); box(-40, 0, 10.5, 40, 0.16, 12.5, '#b5b1a8');
    [-18, -11, -4, 3, 10, 17].forEach(function (x) { box(x - 0.18, 0, 11.3, x + 0.18, 2.6, 11.66, '#6b5646'); crown(x, 4.2, 11.48, 1.9, '#4f8a4a'); });
    var items = [{ key: 'site', sig: 1 }];
    function build() {
      return { op: { pos: new Float32Array(O.pos), col: new Float32Array(O.col), n: O.pos.length / 3 },
        tr: { pos: new Float32Array(Tr.pos), col: new Float32Array(Tr.col), n: Tr.pos.length / 3 },
        ed: { pos: new Float32Array(Ed.pos), n: Ed.pos.length / 3 } };
    }
    /* the camera, by the app's own formulas (core/mesh-primitives.js camVecs, render/webgl.js bimGlProjMatrix) */
    var flat = q.get('flat') === '1', cm = { yaw: flat ? 0 : 0.62, pitch: flat ? Math.PI / 2 - 0.0005 : 0.42, dist: flat ? 70 : 46, tx: 0, ty: 1.5, tz: 2 };
    var cy = Math.cos(cm.yaw), sy = Math.sin(cm.yaw), cp = Math.cos(cm.pitch), sp = Math.sin(cm.pitch), d = [cp * sy, sp, cp * cy];
    var r = bimRvUnit(bimRvCross([0, 1, 0], d)), u = bimRvCross(d, r), eye = [cm.tx + d[0] * cm.dist, cm.ty + d[1] * cm.dist, cm.tz + d[2] * cm.dist];
    var near = cm.dist > 1000 ? cm.dist / 2000 : 0.5, far = Math.max(4000, cm.dist * 8), proj, k, f;
    if (flat) { k = H * 1.2 / Math.max(cm.dist, 0.5); proj = [k / (W / 2), 0, 0, 0, 0, k / (H / 2), 0, 0, 0, 0, -2 / (far - near), 0, 0, 0, -(far + near) / (far - near), 1]; }
    else { f = H * 1.2; proj = [f / (W / 2), 0, 0, 0, 0, f / (H / 2), 0, 0, 0, 0, -(far + near) / (far - near), -1, 0, 0, -2 * far * near / (far - near), 0]; }
    var alt = q.has('alt') ? +q.get('alt') : 42, az = q.has('az') ? +q.get('az') : 215, e = alt * Math.PI / 180, a = az * Math.PI / 180;
    var sun = [Math.cos(e) * Math.sin(a), Math.sin(e), -Math.cos(e) * Math.cos(a)], sunUp = sun[1] > 0.02;
    var spec = { world: [r[0], r[1], r[2], 0, u[0], u[1], u[2], 0, d[0], d[1], d[2], 0, eye[0], eye[1], eye[2], 1], proj: proj,
      focus: [cm.tx, cm.ty, cm.tz], reach: cm.dist * 0.6, sun: sunUp ? sun : null, sky: bimRvSkyFor(q.get('sky') || 'clear', sunUp, alt),
      ground: q.get('ground') !== '0', groundAt: 0, edges: q.get('edges') === '1' };
    var t0 = performance.now(), core = bimRvCore(T, cv, {}), g = cv.getContext('webgl2'), N = +q.get('n') || 64, i;
    core.size(W, H); core.scene(items, build); core.begin(spec); core.pass(); core.show(); g.finish();
    out.first = Math.round(performance.now() - t0);
    out.firstShot = q.get('first') === '1';
    if (!out.firstShot) {
      t0 = performance.now();
      for (i = 1; i < N; i++) core.pass();
      core.show(); g.finish();
      var px = new Uint8Array(4); g.readPixels(0, 0, 1, 1, g.RGBA, g.UNSIGNED_BYTE, px);
      out.rest = Math.round(performance.now() - t0); out.perPass = Math.round(out.rest / Math.max(1, N - 1) * 100) / 100;
    }
    out.stats = core.stats(); out.triangles = (O.pos.length + Tr.pos.length) / 9; out.revision = T.REVISION; out.sky = spec.sky.n;
    /* is the picture a picture: the share of pixels that differ from the first, over a coarse grid */
    var c2 = document.createElement('canvas'); c2.width = 64; c2.height = 36; var x = c2.getContext('2d'); x.drawImage(cv, 0, 0, 64, 36);
    var dta = x.getImageData(0, 0, 64, 36).data, dif = 0, lum = 0;
    for (i = 0; i < dta.length; i += 4) { if (Math.abs(dta[i] - dta[0]) + Math.abs(dta[i + 1] - dta[1]) + Math.abs(dta[i + 2] - dta[2]) > 24) dif++; lum += dta[i] + dta[i + 1] + dta[i + 2]; }
    out.varied = Math.round(dif / (dta.length / 4) * 100); out.meanLum = Math.round(lum / (dta.length / 4) / 3);
  } catch (err) { out.errors.push(String(err && err.stack || err)); }
  window.__done = true;
})();
</script>
