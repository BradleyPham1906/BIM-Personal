# Publishes the app to GitHub Pages on every push to main.
# Only the app goes out: canvas_v10.html, also served as index.html so the site's
# address opens it. Served from https, the app sends a real origin and Referer,
# which tile, geocoding and Overpass servers expect from a browser.
name: Publish app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp canvas_v10.html _site/index.html
          cp canvas_v10.html _site/canvas_v10.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
